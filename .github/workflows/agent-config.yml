name: Agent config

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Canon renders clean (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Ensure a python3 launcher exists (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/bin/python3"
            chmod +x "$HOME/bin/python3"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Run the shared setup entry point
        run: bash .agents/setup --all

      - name: Prove system-bash 3.2 compatibility (macOS)
        # Setup is idempotent, so re-running under the oldest bash in the
        # wild is free and keeps personal Macs working.
        if: runner.os == 'macOS'
        run: /bin/bash .agents/setup --all

      - name: Verify invariants
        run: python3 .agents/sync.py check

      - name: No untracked files left behind
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "Setup left files that are neither tracked nor ignored."
            exit 1
          fi
