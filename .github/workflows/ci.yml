# Generated by toolfactory. Do not edit; run `toolfactory build` to regenerate.

name: CI
on:
  push:
    branches:
      - main
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TOOLFACTORY_SYSTEM_NATIVE_JOBS: "true"
    strategy:
      matrix:
        node-version:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - name: install
        run: npm ci
      - name: build
        run: npm run --if-present build
      - name: toolfactory check
        run: npx toolfactory check
      - name: toolfactory build (output files)
        run: npx toolfactory build
      - name: toolfactory validate
        run: npx toolfactory validate
        if: matrix.node-version == '24'
      - name: author checks
        run: npm run --if-present check
      - name: author tests
        run: npm test
      - name: author integration tests
        run: npm run --if-present test:integration
      - name: openclaw end-to-end (scripted model, no LLM key)
        run: npm --prefix hosts/openclaw run --if-present test:e2e
        if: matrix.node-version == '24'
